
task copyGeneratedSources {
    group 'copy-vimotest-generated-sources'

    doLast {
        def generatedDir = "$rootDir/vimotest-jabref/solutions/ViMoTests/source_gen"
        println "Copying generated sources from $generatedDir to src/generated/java"
        delete 'src/generated'

        copy {
            from generatedDir
            into 'src-gen/vimotest/java'
            include '**/*.java'
            exclude '**/*Test.java', '**/*ViewModelTestSetupImpl.java'
        }
        copy {
            from generatedDir
            into 'src/test-gen/java'
            include '**/*Test.java'
        }

        // Alle kopierten Java-Dateien transformieren
        [ 'src-gen/vimotest/java', 'src/test-gen/java' ].each { dir ->
            fileTree(dir: dir, include: '**/*.java').each { File javaFile ->
                def text = javaFile.text
                text = text.replaceAll('(?<!\\w)Assert\\.', 'Assertions.')
                text = text.replaceAll('org\\.junit\\.Assert', 'org.junit.jupiter.api.Assertions')
                text = text.replaceAll('_Test \\{', '_Test extends org.testfx.framework.junit5.ApplicationTest {')
                javaFile.text = text
            }
        }
    }
}

// Optionally, clean the generated directory to avoid stale files
clean.doLast {
    delete 'src/generated'
}
